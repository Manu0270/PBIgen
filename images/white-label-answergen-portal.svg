<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 356" width="720" height="356" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">White-label Answergen portal</title>
  <desc id="d">A branded browser window at portal.yourcompany.com showing a customer-branded navigation bar with SSO and row-level security badges above a dashboard of KPI tiles, a bar chart and a line chart.</desc>
  <defs>
    <clipPath id="win"><rect width="720" height="356" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#win)" font-family="Sora, 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif">
    <!-- window -->
    <rect width="720" height="356" fill="#FFFFFF"/>

    <!-- browser bar -->
    <rect width="720" height="40" fill="#EEF2F8"/>
    <line x1="0" y1="40" x2="720" y2="40" stroke="#DDE3EC"/>
    <g fill="#C5CEDC"><circle cx="21" cy="20" r="4.5"/><circle cx="37" cy="20" r="4.5"/><circle cx="53" cy="20" r="4.5"/></g>
    <rect x="72" y="10" width="196" height="21" rx="6" fill="#FFFFFF"/>
    <text x="170" y="24.5" text-anchor="middle" font-size="12" fill="#52627A">portal.yourcompany.com</text>

    <!-- portal nav (customer branding) -->
    <text x="20" y="72" font-size="15" font-weight="600" fill="#3D6FE0">YourCo</text>
    <g font-size="13" fill="#0E1A2B">
      <text x="92" y="72">Sales</text>
      <text x="144" y="72">Finance</text>
      <text x="212" y="72">Operations</text>
    </g>
    <rect x="544" y="57" width="68" height="22" rx="11" fill="#E3F6F1"/>
    <text x="578" y="72" text-anchor="middle" font-size="11" fill="#0A7A66">SSO on</text>
    <rect x="620" y="57" width="82" height="22" rx="11" fill="#EFE8FF"/>
    <text x="661" y="72" text-anchor="middle" font-size="11" fill="#6A3FD0">RLS: West</text>
    <line x1="0" y1="92" x2="720" y2="92" stroke="#DDE3EC"/>

    <!-- dashboard -->
    <g transform="translate(14 106) scale(1.5727)">
      <g fill="#EEF2F8">
        <rect width="140" height="40" rx="8"/><rect x="150" width="140" height="40" rx="8"/><rect x="300" width="140" height="40" rx="8"/>
        <rect y="50" width="215" height="100" rx="8"/><rect x="225" y="50" width="215" height="100" rx="8"/>
      </g>
      <g fill="#F2B01E">
        <rect x="22" y="104" width="24" height="34"/><rect x="58" y="86" width="24" height="52"/><rect x="94" y="96" width="24" height="42"/>
        <rect x="130" y="70" width="24" height="68"/><rect x="166" y="80" width="24" height="58"/>
      </g>
      <polyline points="240,128 285,98 330,108 375,72 425,62" fill="none" stroke="#3D6FE0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <rect x=".5" y=".5" width="719" height="355" rx="15.5" fill="none" stroke="#DDE3EC"/>
</svg>
