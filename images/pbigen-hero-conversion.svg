<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 360" role="img" aria-label="A Tableau dashboard is processed by PBIgen and becomes an identical Power BI dashboard" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>.flow{stroke-dasharray:6 8;animation:dash 1.4s linear infinite}@keyframes dash{to{stroke-dashoffset:-28}}@media (prefers-reduced-motion:reduce){.flow{animation:none}}text{font-family:Sora,"IBM Plex Sans",system-ui,sans-serif}</style>
<defs><linearGradient id="gr" x1="0" x2="1"><stop offset="0" stop-color="#4C93FF"/><stop offset="1" stop-color="#9066F7"/></linearGradient>
<filter id="gl"><feGaussianBlur stdDeviation="14"/></filter>
<g id="d">
<rect width="300" height="210" rx="16" fill="#0C1326" stroke="currentColor" stroke-opacity=".5"/>
<g fill="currentColor"><rect x="16" y="16" width="86" height="40" rx="8" opacity=".22"/><rect x="108" y="16" width="86" height="40" rx="8" opacity=".22"/><rect x="200" y="16" width="84" height="40" rx="8" opacity=".22"/>
<rect x="16" y="66" width="132" height="128" rx="8" opacity=".12"/><rect x="156" y="66" width="128" height="128" rx="8" opacity=".12"/>
<rect x="30" y="150" width="14" height="34" opacity=".85"/><rect x="52" y="124" width="14" height="60" opacity=".85"/><rect x="74" y="138" width="14" height="46" opacity=".85"/><rect x="96" y="100" width="14" height="84" opacity=".85"/><rect x="118" y="112" width="14" height="72" opacity=".85"/></g>
<polyline points="170,176 196,146 220,158 248,112 272,98" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g></defs>
<circle cx="520" cy="180" r="110" fill="url(#gr)" opacity=".55" filter="url(#gl)"/>
<g stroke="url(#gr)" stroke-width="2" fill="none" class="flow"><path d="M350 150 C430 150 430 180 470 180"/><path d="M570 180 C610 180 610 150 690 150"/><path d="M350 230 C430 230 430 190 480 190"/><path d="M560 190 C610 190 610 230 690 230"/></g>
<circle cx="520" cy="180" r="62" fill="#0C1326" stroke="url(#gr)" stroke-width="2"/>
<text x="520" y="178" text-anchor="middle" font-weight="300" font-size="20" fill="#E9EEFA">PBIgen</text>
<text x="520" y="200" text-anchor="middle" font-weight="300" font-size="12" fill="#8E9DBF">x, y, w, h + DAX</text>
<g transform="translate(40,60) skewY(6)" style="color:#4C93FF"><use href="#d"/></g>
<g transform="translate(700,60) skewY(-6)" style="color:#F5BC48"><use href="#d"/></g>
<text x="190" y="332" text-anchor="middle" font-weight="300" font-size="14" fill="#8E9DBF">Tableau workbook (.twb)</text>
<text x="850" y="332" text-anchor="middle" font-weight="300" font-size="14" fill="#8E9DBF">Power BI report, same layout</text>
</svg>
